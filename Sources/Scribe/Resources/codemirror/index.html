<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Editor</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #282a36;
            overflow: hidden;
        }

        #editor {
            width: 100%;
            height: 100%;
            background-color: #282a36;
            color: #f8f8f2;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 20px;
            border: none;
            resize: none;
            outline: none;
        }
    </style>
</head>

<body>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            window.webkit?.messageHandlers?.consoleLog?.postMessage("JS Error: " + msg + " at " + line + ":" + col);
            console.error(msg, error);
        };
    </script>

    <textarea id="editor" placeholder="Start typing..."></textarea>

    <script>
        const bridge = window.webkit?.messageHandlers?.scribeBridge;
        const logger = window.webkit?.messageHandlers?.consoleLog;

        function log(msg) {
            console.log(msg);
            if (logger) logger.postMessage(msg);
        }

        log("Simple editor initialized");

        const textarea = document.getElementById('editor');

        // Send changes to Swift
        textarea.addEventListener('input', function(e) {
            const content = textarea.value;
            if (bridge) {
                bridge.postMessage({ type: "UPDATE_CONTENT", content: content });
            }
        });

        // Notify Swift that editor is ready
        if (bridge) bridge.postMessage({ type: "EDITOR_READY" });

        // Function to set markdown from Swift
        window.setMarkdown = function (content) {
            log("setMarkdown called with " + content.length + " chars");
            const current = textarea.value;
            if (current !== content) {
                textarea.value = content;
            }
        };
    </script>
</body>

</html>
