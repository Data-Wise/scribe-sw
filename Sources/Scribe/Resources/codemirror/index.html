<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeMirror 5 Editor</title>

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="codemirror.css">
    <link rel="stylesheet" href="dracula.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #282a36;
            overflow: hidden;
        }

        #editor {
            height: 100vh;
            width: 100vw;
        }

        .CodeMirror {
            font-family: 'SF Mono', 'Fira Code', Monaco, monospace;
            height: 100%;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            window.webkit?.messageHandlers?.consoleLog?.postMessage("JS Error: " + msg + " at " + line + ":" + col);
        };
    </script>

    <div id="editor"></div>

    <!-- CodeMirror JS -->
    <script src="codemirror.js"></script>
    <script src="markdown.js"></script>

    <script>
        // Bridge Logic
        const bridge = window.webkit?.messageHandlers?.scribeBridge;
        const logger = window.webkit?.messageHandlers?.consoleLog;

        function log(msg) {
            if (logger) logger.postMessage(msg);
        }

        log("Initializing CodeMirror 5...");

        // Initialize Editor
        const editor = CodeMirror(document.getElementById("editor"), {
            mode: "markdown",
            theme: "dracula",
            lineNumbers: true,
            lineWrapping: true,
            placeholder: "Start typing...",
            value: ""
        });

        log("Editor initialized.");

        // Loop changes back to Swift
        editor.on("change", function (cm, change) {
            if (change.origin === "setValue") return;
            const content = cm.getValue();
            if (bridge) {
                bridge.postMessage({ type: "UPDATE_CONTENT", content: content });
            }
        });

        // Notify Swift that editor is ready
        log("Ready.");
        if (bridge) bridge.postMessage({ type: "EDITOR_READY" });

        // Function to set markdown from Swift
        window.setMarkdown = function (content) {
            const current = editor.getValue();
            if (current !== content) {
                editor.setValue(content);
            }
        };
    </script>
</body>

</html>
